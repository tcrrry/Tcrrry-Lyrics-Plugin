name: Verify independent lyrics and translation plugins
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :engine:testDebugUnitTest :translation-plugin:testDebugUnitTest :offline-runtime:testDebugUnitTest :engine:lintRelease :translation-plugin:lintRelease :offline-runtime:lintRelease packagePlugin packageTranslation --no-daemon --max-workers=2
      - run: python3 scripts/verify-package.py && python3 scripts/verify-translation-package.py
      - run: ./gradlew :engine:testDebugUnitTest --tests '*FullPluginImportTest' --tests '*TranslationPluginImportTest' -PfullPluginFixture="$PWD/dist/Tcrrry-Lyrics-Plugin-1.1.zip" -PtranslationPluginFixture="$PWD/dist/Tcrrry-Translation-Plugin-1.0.0.zip" --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-plugins
          path: |
            dist/Tcrrry-Lyrics-Plugin-1.1.zip
            dist/Tcrrry-Translation-Plugin-1.0.0.zip
            dist/Tcrrry-Lyrics-Plugin-1.1-source.zip
