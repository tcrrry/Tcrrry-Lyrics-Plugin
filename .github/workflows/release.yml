name: Build signed independent plugin
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OFFLINE_KEYSTORE: ${{ github.workspace }}/offline-signing.jks
      OFFLINE_STORE_PASSWORD: ${{ secrets.PLUGIN_OFFLINE_STORE_PASSWORD }}
      OFFLINE_KEY_PASSWORD: ${{ secrets.PLUGIN_OFFLINE_KEY_PASSWORD }}
      OFFLINE_KEY_ALIAS: tcrrry-plugin-offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Restore companion signing key
        env:
          KEY_BASE64: ${{ secrets.PLUGIN_OFFLINE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEY_BASE64"
          printf '%s' "$KEY_BASE64" | base64 --decode > "$OFFLINE_KEYSTORE"
          chmod 600 "$OFFLINE_KEYSTORE"
      - run: ./gradlew :engine:testDebugUnitTest :offline:testDebugUnitTest packagePlugin :engine:lintRelease :offline:lintRelease --no-daemon
      - run: python3 scripts/verify-package.py
      - run: ./gradlew :engine:testDebugUnitTest -PfullPluginFixture="$PWD/dist/Tcrrry-Lyrics-Plugin-1.0.0.zip" --no-daemon
      - run: rm -f "$OFFLINE_KEYSTORE"
        if: always()
      - uses: actions/upload-artifact@v4
        with:
          name: signed-independent-plugin
          path: dist
